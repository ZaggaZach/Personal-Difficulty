# Personal Difficulty - server configuration
#
# Location: <server>/config/personaldifficulty.properties
# Changes apply immediately after "/personaldifficulty admin reload" (no restart, no reconnect).
# Missing keys use the defaults shown here. Invalid values (not a number, NaN, infinity) are
# replaced by the default; out-of-range values are clamped. Problems are logged as warnings.
#
# Multiplier semantics
#   Damage: the value is applied ONCE, to the damage the player would actually lose in vanilla
#   (after armour, resistance and protection enchantments, before absorption hearts). The world's
#   own difficulty scaling (e.g. vanilla Hard's x1.5 for mob damage) is already part of that
#   number and is never re-applied, so "hard.damage-multiplier=1.25" means "25% more than this
#   server's vanilla outcome", not "re-apply Hard".
#   Hunger: multiplies every exhaustion amount the player accrues (sprinting, jumping, mining,
#   combat, damage, hunger effect, natural-regeneration cost). Food level and saturation are never
#   edited directly. Bounds for all multipliers: 0.0 .. 10.0.

# ---- Easy profile ----
easy.damage-multiplier=0.60
easy.hunger-multiplier=0.50
# Ranged aim. Vanilla "uncertainty" (bigger = wider spread) is 14 - 4*worldDifficulty
# (Easy 10, Normal 6, Hard 2). Easy players are shot at with AT LEAST this uncertainty.
# It can only widen the spread, never tighten it. Bounds: 0 .. 60.
easy.ranged-min-uncertainty=14.0

# ---- Hard profile ----
hard.damage-multiplier=1.25
hard.hunger-multiplier=1.25

# ---- Elite profile (a deliberately punishing survival challenge) ----
# Final multiplier, applied once to the damage that would reach health (after armour, resistance and
# protection enchantments, before absorption hearts).
elite.damage-multiplier=2.0
elite.hunger-multiplier=2.0
# Fraction (0..1) of vanilla ARMOUR mitigation that stays in force for Elite. Resistance and Protection
# enchantments are NOT affected. 1.0 = vanilla armour. Why: with a bare x2 multiplier, fully enchanted
# netherite reduces a Hard-world zombie hit (4.5 raw) to ~0.8 HP, i.e. armour neutralises Elite. At 0.60 it is ~1.75 HP.
elite.armor-effectiveness=0.60
# Supported ranged attackers aim at Elite players with AT MOST this uncertainty (vanilla: Easy 10,
# Normal 6, Hard 2; smaller = tighter). It can only tighten the spread, never widen it, and it is
# not a guaranteed hit: moving targets, gravity and travel time still apply. Measured on a STANDING
# player with the spread alone: ~100% of shots at 12 blocks, ~93% at 24, ~77% at 32 (see
# docs/VERIFICATION.md), so the gain over vanilla is mostly at range. Bounds: 0 .. 60.
elite.ranged-max-uncertainty=1.0

# Natural-regeneration speed for Elite players, as a fraction of vanilla (0.1 .. 1.0; 1.0 = vanilla). Vanilla heals on a
# counter: every 10 ticks while the player is saturated (food 20 and some saturation), every 80 ticks when merely well fed
# (food 18+). Elite stretches those intervals by 1/multiplier, so 0.5 makes both 20 and 160 ticks: exactly half the rate, with
# the same amount per heal and the same hunger cost per heal. Other multipliers are rounded to whole ticks. Only NATURAL
# regeneration is affected: the Regeneration and Instant Health effects, golden apples, absorption and /effect are not,
# and the naturalRegeneration game rule is never touched (if it is off nobody regenerates, as before).
elite.natural-regeneration-multiplier=0.50

# ---- Elite enemy behaviour (supported hostile mobs only; see docs/DESIGN.md for exactly which) ----
# Everything below is evaluated from the mob's CURRENT target, so it applies only while an Elite player is the one being
# hunted, and it vanishes the instant the target changes or the player leaves Elite. No attribute is ever modified.
#
# An idle mob may also acquire an Elite player out to this multiple of the mob's own follow range (1.0 = off, max 3.0;
# 1.3.0 used 1.25). A zombie (follow range 35) notices an Elite player up to 105 blocks away, a skeleton (16) up to 48.
# Line of sight, visibility (sneaking, armour-stand heads, invisibility), selectors and every vanilla rule still apply: it
# widens the radius, not the senses. No Elite adjustment ever acts beyond elite.ai.absolute-range-cap (below).
elite.ai.acquisition-range-multiplier=3.0
# A mob keeps hunting an Elite player, and can find a path to them, out to this multiple of its follow range (1.0 = off, max
# 3.0). Used together with the acquisition multiplier: the larger of the two is applied, so a target acquired at the
# extended range is never dropped on the next tick.
elite.ai.follow-range-multiplier=1.25
# Melee and target-memory improvements: a mob remembers an Elite target it can no longer see for longer (next setting) and a
# melee mob re-evaluates whether to start chasing an Elite target every 5 ticks instead of every 20. (The memory part is
# measured in live-AI tests; the re-check delay is only checked at hook level, see docs/VERIFICATION.md.)
elite.ai.improved-pursuit=true
# Vanilla mobs forget a target after 60 ticks (3 s) without line of sight. Multiplier applied for Elite targets, only while
# improved-pursuit is on (1.0 .. 5.0; the result never exceeds 400 ticks = 20 s). 5.0 = 15 s; 1.3.0 used 2.0 (6 s).
elite.ai.target-memory-multiplier=5.0
# Skeleton-family bow cadence against Elite players is the vanilla HARD-difficulty cadence (20 ticks between shots instead
# of 40; with the unchanged draw time that is about 1.5x as many arrows) even when the world is not on Hard. Accuracy is a
# separate, existing setting (elite.ranged-max-uncertainty).
elite.ai.advanced-combat=true
# No Elite range adjustment ever reaches beyond this many blocks, unless the mob's own vanilla range is already larger
# (16 .. 256; 1.3.0 used a fixed 64). Mobs only act in entity-ticking chunks, so the server's simulation distance is a
# further, real limit: on a server with a simulation distance of 8 chunks nothing reacts much beyond about 128 blocks.
elite.ai.absolute-range-cap=128

# ---- Elite target priority (1.3.0) ----
# Hostile mobs (those with player-hunting goals; not endermen or zombified piglins, whose anger is provocation-based) prefer an
# eligible Elite player over any other player - even one they are already fighting. Eligibility uses the mob's own targeting
# rules (line of sight, invisibility, head gear, never Peaceful) inside its finite acquisition range
# (elite.ai.acquisition-range-multiplier). A mob that already hunts an Elite player keeps that target; it never swaps between
# Elite players, so groups of Elite players cannot make mobs flip-flop.
elite.priority.enabled=true
# How often (ticks, 5 .. 40) a mob that is busy with someone else re-evaluates its target. Staggered per mob. Larger = cheaper.
elite.priority.scan-interval-ticks=10
# For this many seconds (0 .. 30, 0 = off) after a mob last SAW its Elite target it may re-acquire that player without line
# of sight, but only if its pathfinder finds a complete route within range (it walks around obstacles, never through them).
elite.priority.reacquire-hidden-seconds=8

# ---- Elite alert network and last-known-position search (1.4.0) ----
# A mob that SEES an Elite player records where and when. Hostile mobs near it learn of that sighting and, if they have no
# target, walk to that remembered point with ordinary pathfinding (around obstacles, never through them). They are never told
# where the player is now: the point goes stale as soon as the player moves. Each mob searches a sighting once.
elite.alert.enabled=true
# Blocks (8 .. 128) within which a mob that knows of a sighting passes it on.
elite.alert.radius=64
# How many times (0 .. 4) a sighting may be passed on; 0 = only the mob that saw the player searches.
elite.alert.hops=2
# Seconds (5 .. 300) a sighting is kept.
elite.alert.memory-seconds=60

# ---- Elite skeletons (1.4.0) ----
# Skeletons, strays and bogged shooting at an ELITE player (any other target gets vanilla shots). Speed and damage are separate:
# vanilla arrow damage already grows with the arrow's speed when it hits, so faster arrows can hit harder on their own; nothing
# here compensates for that (see the README for measured numbers).
elite.skeleton.enabled=true
# Launch speed relative to vanilla (1.0 .. 3.0).
elite.skeleton.arrow-speed-multiplier=1.5
# Scale on the arrow's base damage (0.1 .. 3.0); 1.0 leaves it as vanilla.
elite.skeleton.arrow-damage-multiplier=1.0
# 0 = vanilla aim at where the player is, 1 = aim at where the player will be when the arrow arrives (from their movement).
# A player who changes direction after the shot still dodges.
elite.skeleton.prediction-strength=1.0
# Blocks within which a skeleton starts shooting (15 .. 48; vanilla 15).
elite.skeleton.max-range=24
# Ticks between shots after one is released (10 .. 60; vanilla 40, Hard 20). Vanilla's 20-tick bow draw is never shortened,
# so 10 means a shot about every 30 ticks.
elite.skeleton.firing-interval-ticks=10

# ---- Enderman Blindside (1.4.0) ----
# An Enderman that is ALREADY angry at an Elite player (or was just hit by their arrow or other projectile) may teleport to a spot
# behind them, opposite where they are looking, instead of where vanilla would put it: when it closes the distance (the player is
# more than 16 blocks away) and when it dodges a projectile. Nothing makes an Enderman angry that vanilla would not. The spot must
# have solid ground and headroom, and vanilla's own teleport checks still apply; if there is no such spot, vanilla's teleport
# happens instead.
elite.enderman.blindside-enabled=true
# Probability per qualifying teleport (0 .. 1).
elite.enderman.blindside-chance=0.5
# Blocks behind the player (2 .. 6), plus or minus one at random.
elite.enderman.blindside-distance=3

# ---- Other Elite mobs (1.4.0) ----
# Each applies only while the mob is hunting an ELITE player.
# Zombies, husks and zombie villagers break wooden doors on any world difficulty (vanilla: only on Hard). OFF by default.
elite.zombie.break-doors=false
# Creepers explode after elite.creeper.fuse-ticks instead of vanilla's 30 ticks (1.5 s). OFF by default.
elite.creeper.short-fuse=false
# The shortened fuse in ticks (15 .. 30; 20 ticks = 1 s).
elite.creeper.fuse-ticks=20
# Pillagers fire sooner after charging their crossbow (the charge itself is unchanged).
elite.pillager.fast-crossbow=true
# Ticks a pillager waits after charging before it fires (1 .. 40; vanilla waits 20 to 39).
elite.pillager.attack-delay-ticks=5
# Wardens: the anger a Warden gains toward an ELITE player from its own senses (vibrations, smell, being hit) is multiplied, so
# it attacks them sooner. No extra range and nothing through walls: only anger vanilla already gives is scaled. OFF by default.
elite.warden.enabled=false
# The factor (1.0 .. 3.0); 2.0 means two vibrations instead of three before it attacks.
elite.warden.anger-multiplier=2.0

# ---- Elite combat effects (1.3.0) ----
# When one of these mobs genuinely damages an ELITE player (shield-blocked, fully prevented, cancelled and Peaceful hits do not
# count; fire, poison, explosions, thorns and PvP never count) it may inflict a temporary effect. Chance is per successful hit
# (0 .. 1), seconds is the base duration (1 .. 60). Effects never stack beyond elite.effects.max-duration-seconds and an
# existing stronger effect is never weakened.
elite.effects.enabled=true
elite.effects.max-duration-seconds=30
# Zombies and zombie villagers (not husks: vanilla husks already inflict Hunger): Weakness I + Hunger I. If the player is
# still infected, the next infection deepens it once (Weakness II, Hunger II, 3+ s of Nausea).
elite.effects.zombie-infection-chance=0.35
elite.effects.zombie-infection-seconds=8
# Spiders: Slowness I.
elite.effects.spider-venom-chance=0.35
elite.effects.spider-venom-seconds=5
# Cave spiders: Slowness II (on top of vanilla's own poison on Normal/Hard worlds).
elite.effects.cave-spider-venom-chance=0.50
elite.effects.cave-spider-venom-seconds=6
# Plain skeletons, by ARROW hit only: Slowness I. Strays and bogged already carry their own arrow effects; none is added.
elite.effects.skeleton-shot-chance=0.25
elite.effects.skeleton-shot-seconds=4
# Drowned, by melee only (not thrown tridents): Slowness I.
elite.effects.drowned-chill-chance=0.30
elite.effects.drowned-chill-seconds=3
# 1.4.0: vindicators, by melee: Mining Fatigue I.
elite.effects.vindicator-fatigue-chance=0.35
elite.effects.vindicator-fatigue-seconds=6
# 1.4.0: endermen, by melee: Darkness.
elite.effects.enderman-darkness-chance=0.50
elite.effects.enderman-darkness-seconds=4
# 1.4.0: wither skeletons, by melee: vanilla's own Wither (10 s) lasts this many seconds longer. (An agreed exception to the
# "no doubling of vanilla effects" rule: the Wither is extended, never applied twice or strengthened.)
elite.effects.wither-skeleton-wither-chance=0.50
elite.effects.wither-skeleton-wither-seconds=5
# 1.4.0: blaze and ghast fireballs: a player already set on fire by the hit burns this many seconds longer (no extra damage per
# second; Fire Resistance still protects).
elite.effects.fireball-burn-chance=0.50
elite.effects.fireball-burn-seconds=4

# ---- Peaceful ----
# Peaceful has no tunables by design: a Peaceful player takes no damage except the void and /kill,
# is not targeted by mobs, loses no hunger, cannot be affected by harmful effects and cannot hurt
# other players. See docs/DESIGN.md.

# ---- Exceptions (apply to Easy, Hard and Elite) ----
# Multiplier used INSTEAD of the profile multiplier (Elite's armour weakening is also skipped) when the damage was caused by another player.
pvp.damage-multiplier=1.0
# ...when the damage was caused by the player themself (own arrow, own explosion, ...).
self.damage-multiplier=1.0
# Damage with no attacker (fall, fire, lava, drowning, suffocation, cactus, starvation, ...).
environmental.apply-profile=true
# Void damage (minecraft:out_of_world). Off = unchanged.
void.apply-profile=false
# Administrative damage (/kill and anything tagged bypasses_invulnerability other than the void).
admin.apply-profile=false

# ---- Per-damage-type overrides (optional) ----
# Replaces the profile's damage multiplier for one damage type. Key format:
#   <easy|hard|elite>.damage-type.<namespace>.<path>=<multiplier>
# Exceptions above (void, admin, self, pvp) win over overrides. Examples:
#easy.damage-type.minecraft.fall=0.3
#easy.damage-type.minecraft.explosion=0.4

# ---- Ranged attackers whose aim is adjusted (widened for Easy, tightened for Elite) ----
ranged.skeletons=true
ranged.illusioners=true
ranged.drowned=true
# Pillagers.
ranged.crossbow-mobs=true
# Piglin crossbows (brain-driven; see docs/DESIGN.md)
ranged.piglins=true
ranged.witches=true
