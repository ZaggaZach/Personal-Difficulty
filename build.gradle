plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
}

fabricApi {
	// In-server integration tests (real ServerPlayer / mobs / mixins): src/gametest, run with ./gradlew runGameTest
	configureTests {
		createSourceSet = true
		modId = "personaldifficulty-gametest"
		enableGameTests = true
		eula = true
		clearRunDirectory = true
	}
}

loom {
	mods {
		"personaldifficulty" {
			sourceSet sourceSets.main
		}
	}
	runs {
		// ./gradlew runServer: a real dedicated server in run/ (see docs/VERIFICATION.md)
		server {
			server()
			runDir "run"
		}
		// JUnit-style XML for the in-server tests
		gameTest {
			property "fabric-api.gametest.report-file", layout.buildDirectory.file("reports/gametest/junit.xml").get().asFile.absolutePath
			// the Phase 5 performance measurement runs only when asked for: ./gradlew build -PpdPerf=true
			property "pd.perf", String.valueOf(project.findProperty("pdPerf") ?: "false")
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	testImplementation platform("org.junit:junit-bom:5.11.4")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
	// the end-to-end tests (tag "e2e") need a downloaded server and are run only by ./gradlew e2eTest
	useJUnitPlatform {
		excludeTags "e2e"
	}
	testLogging {
		events "passed", "failed", "skipped"
		exceptionFormat "full"
	}
}

// Test-only fixture mod for the end-to-end tests (opens a test menu built on the ui base classes). Built from the test
// classes in ...e2e.fixture plus src/e2e-fixture/fabric.mod.json; never part of the shipped jar.
tasks.register("e2eFixtureJar", Jar) {
	group = "verification"
	description = "Builds the test-only fixture mod used by e2eTest."
	dependsOn "testClasses"
	archiveBaseName = "personaldifficulty-e2e-fixture"
	archiveVersion = "0"
	destinationDirectory = layout.buildDirectory.dir("e2e/libs")
	from(sourceSets.test.output.classesDirs) {
		include "com/zaggazach/personaldifficulty/e2e/fixture/**"
	}
	from("src/e2e-fixture") {
		include "fabric.mod.json"
	}
}

// End-to-end tests: a REAL dedicated server process runs the built jar and a headless protocol client connects to it.
// NOT part of `build`/`check`. First use downloads the Fabric installer, the Minecraft server and Fabric API into
// build/e2e/cache (network access to maven.fabricmc.net and Mojang's download servers needed once; later runs are offline
// if the cache is kept).
tasks.register("e2eTest", Test) {
	group = "verification"
	description = "Runs the end-to-end tests against a real dedicated server process (downloads on first use)."
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform {
		includeTags "e2e"
	}
	dependsOn jar, tasks.named("e2eFixtureJar")
	systemProperty "pd.jar", jar.archiveFile.get().asFile.absolutePath
	systemProperty "pd.fixture.jar", tasks.named("e2eFixtureJar").get().archiveFile.get().asFile.absolutePath
	systemProperty "pd.e2e.minecraft", project.minecraft_version
	systemProperty "pd.e2e.loader", project.loader_version
	systemProperty "pd.e2e.fabricApi", project.fabric_api_version
	systemProperty "pd.e2e.cache", System.getProperty("pdE2eCache", layout.buildDirectory.dir("e2e/cache").get().asFile.absolutePath)
	systemProperty "pd.e2e.work", layout.buildDirectory.dir("e2e/work").get().asFile.absolutePath
	systemProperty "pd.e2e.debug", System.getProperty("e2eDebug", "false")
	systemProperty "pd.e2e.serverDebug", System.getProperty("e2eServerDebug", "false")
	testLogging {
		events "passed", "failed", "skipped"
		exceptionFormat "full"
		showStandardStreams = false
	}
}

processResources {
	def v = project.version
	inputs.property "version", v
	filesMatching("fabric.mod.json") {
		expand "version": v
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName
	from("LICENSE") {
		rename { "${it}_$projectName" }
	}
}
